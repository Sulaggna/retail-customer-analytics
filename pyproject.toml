[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics"
version = "1.0.0"
description = "End-to-end customer & revenue analytics on 1M+ real online-retail transactions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
notebook = ["nbformat>=5.9", "nbconvert>=7.16", "ipykernel>=6.29"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
